<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Centro de Adopción</title>

    <!-- Fuentes personalizadas -->
    <link href="https://fonts.googleapis.com/css?family=Fredoka:wght@400;500;600&family=Pacifico&display=swap" rel="stylesheet">

    <!-- Enlace a la hoja de estilos compartida -->
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>

<!-- Triángulos decorativos de las esquinas -->
<div class="esquina-izq"></div>
<div class="esquina-der"></div>

<div class="page-wrapper">
    <h2 class="top-title">Centro de Adopciones</h2>
    <h1 class="main-title">Patitas a Casa</h1>

    <div class="login-card">
        <h2>CREAR CUENTA</h2>

        <!-- Mantiene el procesamiento de datos hacia tu controlador -->
        <form th:action="@{/procesar-registro}" method="post">

            <div class="form-row">
                <div class="input-group">
                    <label for="nombre">NOMBRE DE USUARIO</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Ej: Carlos123" required />
                </div>
            </div>

            <div class="form-row">
                <div class="input-group">
                    <label for="password">CONTRASEÑA</label>
                    <input type="password" id="password" name="password" placeholder="Crea una contraseña" required />
                </div>
            </div>

            <div class="form-row">
                <div class="input-group">
                    <label for="correo">CORREO ELECTRÓNICO</label>
                    <input type="email" id="correo" name="correo" placeholder="tu@correo.com" />
                </div>
            </div>

            <button type="submit" class="btn-entrar" style="background-color: #ff9eb5;">Registrarme</button>
        </form>

        <!-- Redirección al login -->
        <a th:href="@{/index}" class="link-registro">¿Ya tienes cuenta? Inicia sesión aquí</a>
    </div>
</div>

</body>
</html>
